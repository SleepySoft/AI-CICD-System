# ============================================================
# AISystem 一体化研发环境 —— 唯一事实源
#
# 默认（不带 profile）启动核心栈:
#   caddy(入口) / postgres / redis / keycloak / gitea / jenkins / homepage
#
# 可选 profile:
#   knowledge     Qdrant + Outline + MkDocs 文档站
#   requirements  OpenProject 需求管理
#   monitor       Uptime Kuma 状态监控
#   localai       Ollama（本地 embedding / 小模型）
#   browsers      Playwright 有头浏览器 (noVNC 可视化)
#
# 示例:
#   docker compose up -d                                  # 仅核心
#   docker compose --profile knowledge up -d              # 核心 + 知识库
#   docker compose --profile knowledge --profile monitor \
#       --profile requirements up -d                      # 多个 profile 组合
#
# 数据持久化（NFR-008 / ADR-0012）：业务数据全部显式 bind mount 到
#   ${DATA_ROOT:-./data}/private/<组件>（仅该组件挂载），${DATA_ROOT:-./data}/public → /public（所有容器共享交换区）
#   （ADR-0026）；禁用命名卷；升级只重建容器，不动数据目录。
# ============================================================

name: aisystem

networks:
  aisystem:
    driver: bridge

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}

services:

  # ----------------------------------------------------------
  # 入口：反向代理（唯一对外 HTTP 端口）
  # ----------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 回源宿主侧 supervisor（ADR-0020）
    environment: *common-env
    networks: [aisystem]

  # ----------------------------------------------------------
  # 基础设施：共享 PostgreSQL / Redis
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER:-aisys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${DATA_ROOT:-./data}/private/postgres:/var/lib/postgresql/data
      - ${DATA_ROOT:-./data}/public:/public
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aisystem]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_ROOT:-./data}/private/redis:/data
      - ${DATA_ROOT:-./data}/public:/public
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aisystem]

  # ----------------------------------------------------------
  # SSO：Keycloak（预置 realm 自动导入，含 dev/boss 组）
  # ----------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      <<: *common-env
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-aisys}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://sso.${BASE_DOMAIN:-localhost}
      # 允许容器间回源（backchannel）使用内部地址 keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # 业务数据在共享 Postgres（keycloak 库），无需持久卷（NFR-008）
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [aisystem]

  # ----------------------------------------------------------
  # Git 仓库 + 管理界面：Gitea
  # ----------------------------------------------------------
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    environment:
      <<: *common-env
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__webhook__ALLOWED_HOST_LIST: "*"   # 允许内网 webhook（jenkins 等），内网环境可接受
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: ${POSTGRES_USER:-aisys}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:?}
      GITEA__server__DOMAIN: git.${BASE_DOMAIN:-localhost}
      GITEA__server__ROOT_URL: http://git.${BASE_DOMAIN:-localhost}/
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__packages__ENABLED: "true"
    volumes:
      - ${DATA_ROOT:-./data}/private/gitea:/data
      - ${DATA_ROOT:-./data}/public:/public
    ports:
      - "${GITEA_SSH_PORT:-2222}:22"   # git over ssh
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [aisystem]

  # ----------------------------------------------------------
  # CI/CD：Jenkins（JCasC 配置即代码）
  # ----------------------------------------------------------
  jenkins:
    build: ./jenkins
    image: aisystem/jenkins:lts
    restart: unless-stopped
    user: root   # 简化：便于访问挂载的 docker.sock
    environment:
      <<: *common-env
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-gitea_admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?}
      # master 侧 git 操作（分支发现）也用该密钥
      GIT_SSH_COMMAND: ssh -i /var/jenkins_home/.ssh-ro/id_rsa -o StrictHostKeyChecking=no
    # 挂載密钥为 ro 且权限过松，ssh 会拒绝；入口先复制并收权
    command: bash -c "mkdir -p /var/jenkins_home/.ssh-ro && cp /run/ssh/id_rsa /var/jenkins_home/.ssh-ro/id_rsa && chmod 600 /var/jenkins_home/.ssh-ro/id_rsa && chown -R jenkins:jenkins /var/jenkins_home/.ssh-ro && /usr/bin/tini -- /usr/local/bin/jenkins.sh"
    volumes:
      - ${DATA_ROOT:-./data}/private/jenkins:/var/jenkins_home
      - ${DATA_ROOT:-./data}/public:/public
      # 挂载宿主 docker.sock：流水线中用工具链镜像起一次性构建容器
      - /var/run/docker.sock:/var/run/docker.sock
      # GitHub SSH 私仓只读密钥（路径经 .env SSH_KEY_PATH；个人 key 直挂仅适合本机自用，正式换 deploy key）
      - ${SSH_KEY_PATH:-/root/.ssh/id_rsa}:/run/ssh/id_rsa:ro
    extra_hosts:
      # webhook payload 与 SCM source 统一用公开域名 git.localhost；容器内经宿主 Caddy 回源
      - "git.localhost:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks: [aisystem]

  # （统一门户已集成进 Chronicler 首页，Homepage 服务退役）

  # ==========================================================
  # ATR 终端运行时（sandbox profile：可选隔离沙箱，ADR-0021）
  # supervisor（Chronicler）已移出 compose，运行于宿主侧（ADR-0020）
  # ==========================================================
  terminal-runtime:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: images/terminal-runtime/Dockerfile
    image: aisystem/terminal-runtime:latest
    restart: unless-stopped
    environment:
      <<: *common-env
      ATR_API_TOKEN: ${ATR_API_TOKEN:?ATR_API_TOKEN is required}
    volumes:
      - ${DATA_ROOT:-./data}/private/terminal-runtime:/opt/agents        # agent CLI 与登录态持久卷（ADR-0017，NFR-008）
      - ${DATA_ROOT:-./data}/public:/public
      - ./scripts/agents:/opt/agent-install:ro         # 锁版本安装脚本
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${ATR_API_TOKEN}\" http://localhost:18650/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [aisystem]

  # ==========================================================
  # profile: knowledge —— 向量库 + 知识库 Web + 文档站
  # ==========================================================
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    profiles: ["knowledge"]
    environment: *common-env
    volumes:
      - ${DATA_ROOT:-./data}/private/qdrant:/qdrant/storage
      - ${DATA_ROOT:-./data}/public:/public
    # qdrant 镜像无 wget/curl，不做容器内健康检查（宿主侧经 Caddy 探测 vectors.localhost）
    networks: [aisystem]

  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    restart: unless-stopped
    profiles: ["knowledge"]
    # 内网 HTTP 部署：production 会把 OAuth state cookie 标 secure → 登录 500（2026-08-29 实测）；
    # 启动补丁脚本把 passport.js 的 secure 标记关掉（镜像升级后若失效需复评）
    command: ["sh", "/opt/outline/patch-start.sh"]
    environment:
      <<: *common-env
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?}
      PGSSLMODE: disable   # 内网 postgres 无 SSL
      DATABASE_URL: postgres://${POSTGRES_USER:-aisys}:${POSTGRES_PASSWORD}@postgres:5432/outline
      REDIS_URL: redis://redis:6379
      URL: http://kb.${BASE_DOMAIN:-localhost}
      PORT: "3000"
      FORCE_HTTPS: "false"
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: "26214400"
      # OIDC -> Keycloak
      OIDC_CLIENT_ID: outline
      OIDC_CLIENT_SECRET: ${OIDC_OUTLINE_SECRET:?}
      OIDC_AUTH_URI: http://sso.${BASE_DOMAIN:-localhost}/realms/aisystem/protocol/openid-connect/auth
      OIDC_TOKEN_URI: http://keycloak:8080/realms/aisystem/protocol/openid-connect/token
      OIDC_USERINFO_URI: http://keycloak:8080/realms/aisystem/protocol/openid-connect/userinfo
      OIDC_LOGOUT_URI: http://sso.${BASE_DOMAIN:-localhost}/realms/aisystem/protocol/openid-connect/logout
      OIDC_USERNAME_CLAIM: preferred_username
      OIDC_DISPLAY_NAME: Keycloak
      OIDC_SCOPES: openid profile email
    volumes:
      - ${DATA_ROOT:-./data}/private/outline:/var/lib/outline/data
      - ${DATA_ROOT:-./data}/public:/public
      - ./images/outline/patch-start.sh:/opt/outline/patch-start.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [aisystem]

  mkdocs:
    image: squidfunk/mkdocs-material:latest
    restart: unless-stopped
    profiles: ["knowledge"]
    working_dir: /docs
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    volumes:
      - ./mkdocs:/docs
      - ${DATA_ROOT:-./data}/public/shadow:/docs/docs/shadow   # 被管工程 shadow 仓（Chronicler 产出，ADR-0028）
    networks: [aisystem]

  # ==========================================================
  # profile: requirements —— OpenProject 需求管理
  # ==========================================================
  openproject:
    image: openproject/openproject:15
    restart: unless-stopped
    profiles: ["requirements"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-aisys}:${POSTGRES_PASSWORD}@postgres:5432/openproject
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:?}
      OPENPROJECT_HOST__NAME: req.${BASE_DOMAIN:-localhost}
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_DEFAULT__LANGUAGE: zh
    volumes:
      - ${DATA_ROOT:-./data}/private/openproject:/var/openproject/assets
      - ${DATA_ROOT:-./data}/public:/public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [aisystem]

  # ==========================================================
  # profile: monitor —— Uptime Kuma 状态页
  # ==========================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles: ["monitor"]
    environment: *common-env
    volumes:
      - ${DATA_ROOT:-./data}/private/uptime-kuma:/app/data
      - ${DATA_ROOT:-./data}/public:/public
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [aisystem]

  # ==========================================================
  # profile: localai —— Ollama（本地 embedding / 小模型）
  # ==========================================================
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["localai"]
    environment: *common-env
    volumes:
      - ${DATA_ROOT:-./data}/private/ollama:/root/.ollama
      - ${DATA_ROOT:-./data}/public:/public
    networks: [aisystem]

  # ==========================================================
  # profile: browsers —— 有头浏览器（noVNC 可视化）
  # 无头场景直接用 Jenkins 流水线中的 mcr.microsoft.com/playwright 镜像
  # ==========================================================
  browsers:
    build: ./images/browsers
    image: aisystem/browsers:latest
    restart: unless-stopped
    profiles: ["browsers"]
    environment: *common-env
    shm_size: "2gb"
    networks: [aisystem]
