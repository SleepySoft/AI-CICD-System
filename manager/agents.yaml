# Agent 注册表（agent_profile 的 M1.5 过渡形态，M2 迁移 Postgres，见 docs/what/manager.md §2.1）
# 新增一家 agent = 一段 scripts/agents/<name>.sh 安装脚本 + 此处一条记录（ADR-0017/0018），不动镜像。
# 字段说明：
#   name          唯一标识，同时是 /opt/agents/<name>/ 安装目录名
#   cli_type      aider|opencode|kimi|...（对齐 agent_profile 契约）
#   command       创建 ATR 会话时启动的命令（容器内绝对路径）
#   install       scripts/agents/ 下的安装脚本文件名（挂载于容器 /opt/agent-install/）
#   env           静态环境变量（如 base_url；明文配置项，禁止放密钥）
#   api_key_ref   密钥引用：指向 Manager 容器环境变量名，创建会话时解析注入（NFR-002，绝不落明文到本文件）
#   extra_args    追加在 command 后的参数
#   max_runtime_sec  任务态运行的最长时限（M2 任务框架使用）
agents:
  - name: aider
    cli_type: aider
    desc: AI pair programming（pip，OpenAI 兼容接口）
    command: /opt/agents/aider/bin/aider
    install: aider.sh
    env:
      OPENAI_API_BASE: https://api.moonshot.cn/v1
    api_key_ref: LLM_API_KEY
    extra_args: ""
    max_runtime_sec: 3600
  - name: kimi
    cli_type: kimi
    desc: Kimi CLI（pip kimi-cli）
    command: /opt/agents/kimi/bin/kimi
    install: kimi.sh
    env: {}
    api_key_ref: LLM_API_KEY
    extra_args: ""
    max_runtime_sec: 3600
