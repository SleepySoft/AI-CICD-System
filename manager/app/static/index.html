<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISystem 管理中心</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <link rel="stylesheet" href="https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css" />
  <style>
    html { color-scheme: dark; }
    body { margin: 0; background: #0f1419; font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; background: #141a21; border-bottom: 1px solid #262e38; }
    .header .title { font-size: 17px; font-weight: 600; color: #e5e9ef; }
    .main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    .group-title { color: #8b98a9; font-size: 14px; margin: 22px 0 10px; }
    .tool-card { background: #1a2230; border: 1px solid #2a3546; border-radius: 8px; padding: 14px 16px; height: 100%; box-sizing: border-box; }
    .tool-name { font-weight: 600; color: #e5e9ef; display: flex; align-items: center; gap: 8px; }
    .tool-desc { color: #8b98a9; font-size: 12px; margin: 8px 0 12px; min-height: 32px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.running { background: #3fb950; } .dot.stopped { background: #8b98a9; }
    .dot.absent { background: #d29922; } .dot.unknown { background: #f85149; } .dot.external { background: #58a6ff; }
    .login-page { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .screen { background: #000; color: #33ff66; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.35; padding: 12px; border-radius: 6px; white-space: pre; overflow: auto; height: 480px; border: 1px solid #2a3546; }
  </style>
</head>
<body>
<div id="app">
  <!-- 未登录 -->
  <div v-if="!user" class="login-page">
    <el-card style="width: 380px; text-align: center; background:#1a2230; border-color:#2a3546;">
      <h2 style="color:#e5e9ef">AISystem 管理中心</h2>
      <p style="color:#8b98a9">环境工具集中管理 · Agent 终端 · 报告中心</p>
      <el-button type="primary" size="large" @click="login" :loading="loading">使用 Keycloak 登录</el-button>
      <p v-if="loginError" style="color:#f85149; font-size:12px">{{ loginError }}</p>
    </el-card>
  </div>

  <!-- 已登录 -->
  <template v-else>
    <div class="header">
      <span class="title">🛠 AISystem 管理中心</span>
      <span>
        <el-tag v-if="isBoss" type="danger" size="small" effect="plain">boss</el-tag>
        <el-tag v-else type="info" size="small" effect="plain">dev</el-tag>
        <span style="color:#e5e9ef; margin: 0 12px 0 8px">{{ user.name }}</span>
        <el-button size="small" @click="logout">退出</el-button>
      </span>
    </div>
    <div class="main">
      <el-tabs v-model="tab">
        <!-- ============ 工具总览 ============ -->
        <el-tab-pane label="工具总览" name="tools">
          <div style="margin-bottom: 8px">
            <el-button size="small" @click="loadTools" :loading="loadingTools">刷新状态</el-button>
            <span style="color:#8b98a9; font-size:12px; margin-left:10px">点击卡片名跳转；boss 可启动/停止/重启</span>
          </div>
          <div v-for="(items, group) in groupedTools" :key="group">
            <div class="group-title">{{ group }}</div>
            <el-row :gutter="14">
              <el-col :span="8" v-for="t in items" :key="t.name" style="margin-bottom:14px">
                <div class="tool-card">
                  <div class="tool-name">
                    <span class="dot" :class="t.status"></span>
                    <el-link v-if="t.url" :href="t.url" target="_blank" :underline="false" style="color:#e5e9ef; font-weight:600">{{ t.desc || t.name }}</el-link>
                    <span v-else>{{ t.desc || t.name }}</span>
                  </div>
                  <div class="tool-desc">{{ t.name }} · {{ statusText(t) }}</div>
                  <el-button v-if="t.url" size="small" type="primary" plain @click="open(t.url)">打开</el-button>
                  <template v-if="isBoss && t.container">
                    <el-button v-if="t.status==='stopped'" size="small" type="success" plain @click="ctl(t,'start')">启动</el-button>
                    <el-button v-if="t.status==='running'" size="small" type="warning" plain @click="ctl(t,'stop')">停止</el-button>
                    <el-button v-if="t.status==='running'" size="small" plain @click="ctl(t,'restart')">重启</el-button>
                  </template>
                </div>
              </el-col>
            </el-row>
          </div>
        </el-tab-pane>

        <!-- ============ Agent 终端 ============ -->
        <el-tab-pane label="Agent 终端" name="agent">
          <el-row :gutter="16">
            <el-col :span="7">
              <el-card shadow="never" style="background:#1a2230; border-color:#2a3546">
                <template #header><span style="color:#e5e9ef">会话</span></template>
                <el-form v-if="isBoss" label-position="top" size="small">
                  <el-form-item label="Agent（来自注册表 agents.yaml）">
                    <el-select v-model="newSession.agent" placeholder="自定义命令" clearable style="width:100%" @change="onAgentChange">
                      <el-option v-for="a in agents" :key="a.name" :value="a.name"
                                 :label="a.name + (a.installed ? '（' + (a.version || '已安装') + '）' : '（未安装）')" :disabled="!a.installed" />
                    </el-select>
                  </el-form-item>
                  <el-form-item v-if="!newSession.agent" label="启动命令（直接启动目标程序，如 bash）"><el-input v-model="newSession.command" placeholder="bash" /></el-form-item>
                  <el-form-item label="会话 ID"><el-input v-model="newSession.id" placeholder="kimi-1" /></el-form-item>
                  <el-form-item label="用途"><el-input v-model="newSession.purpose" placeholder="代码分析" /></el-form-item>
                  <el-button type="primary" size="small" @click="createSession" :loading="acting">创建会话</el-button>
                </el-form>
                <template v-if="isBoss && agents.length">
                  <el-divider style="margin:10px 0" />
                  <div v-for="a in agents" :key="a.name" style="font-size:12px; color:#8b98a9; margin-top:4px">
                    <span style="color:#e5e9ef">{{ a.name }}</span>
                    <span v-if="a.installed"> · {{ a.version || '已安装' }}</span>
                    <el-button v-else size="small" text type="warning" @click="installAgent(a.name)">安装</el-button>
                  </div>
                </template>
                <el-divider />
                <el-button size="small" @click="loadSessions" :loading="loadingSessions">刷新列表</el-button>
                <div v-for="s in sessions" :key="s.id || s.session_id" style="margin-top:8px">
                  <el-link :underline="false" @click="selectSession(s.id || s.session_id)" style="color:#58a6ff">{{ s.id || s.session_id }}</el-link>
                  <el-button v-if="isBoss" size="small" text type="danger" style="float:right" @click="removeSession(s.id || s.session_id)">删除</el-button>
                </div>
                <p v-if="!sessions.length" style="color:#8b98a9; font-size:12px">暂无会话</p>
              </el-card>
            </el-col>
            <el-col :span="17">
              <el-card shadow="never" style="background:#1a2230; border-color:#2a3546">
                <template #header>
                  <span style="color:#e5e9ef">{{ currentSession || '未选择会话' }}</span>
                  <el-switch v-if="currentSession" v-model="autoRefresh" active-text="自动刷新" style="float:right" />
                </template>
                <div class="screen">{{ screenText || '（空屏幕）' }}</div>
                <div v-if="currentSession" style="margin-top:10px">
                  <el-input v-model="cmdText" placeholder="输入命令，回车提交（submit）" @keyup.enter="submitCmd" :disabled="!isBoss">
                    <template #append><el-button @click="submitCmd" :disabled="!isBoss">提交</el-button></template>
                  </el-input>
                  <div style="margin-top:8px">
                    <el-button size="small" @click="sendKey('ENTER')" :disabled="!isBoss">⏎</el-button>
                    <el-button size="small" @click="sendKey('UP')" :disabled="!isBoss">↑</el-button>
                    <el-button size="small" @click="sendKey('DOWN')" :disabled="!isBoss">↓</el-button>
                    <el-button size="small" @click="sendKey('TAB')" :disabled="!isBoss">Tab</el-button>
                    <el-button size="small" @click="sendKey('ESC')" :disabled="!isBoss">Esc</el-button>
                    <el-button size="small" @click="sendControl('CTRL_C')" :disabled="!isBoss">Ctrl+C</el-button>
                    <el-button size="small" @click="refreshScreen">刷新屏幕</el-button>
                    <el-button size="small" @click="waitStable">等待稳定</el-button>
                  </div>
                </div>
              </el-card>
            </el-col>
          </el-row>
        </el-tab-pane>
      </el-tabs>
    </div>
  </template>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
