schema_version: 1
profiles: []
dependency_only: true
depends_on: []
conflicts_with: []
platforms: [windows, linux, darwin]
resources:
  memory_mb: 256
  disk_mb: 2048
fields:
  - key: POSTGRES_USER
    label: 数据库用户名
    kind: text
    required: true
    default: aisys
  - key: POSTGRES_PASSWORD
    label: 数据库服务密码
    kind: secret
    secret_type: password
    required: true
    generate: password
    generate_length: 24
    rotation_risk: coordinated
    help: PostgreSQL 与所有依赖它的组件共用此登录密码。初始化后轮换必须同步修改数据库内账号及全部消费者，否则依赖组件将无法连接。
readiness:
  kind: container-health
  timeout_sec: 180