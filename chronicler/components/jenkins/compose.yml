# jenkins 组件部署定义（ADR-0027：组件目录自包含）
# 由 Chronicler 拉起：docker compose -p aisystem --env-file <repo>/.env -f <本文件> up -d；REPO_ROOT/DATA_ROOT 由 Chronicler 注入绝对路径
services:
  jenkins:
    build: ${COMPONENTS_ROOT:-..}/jenkins
    image: aisystem/jenkins:lts
    restart: unless-stopped
    user: root
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-gitea_admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?}
      GIT_SSH_COMMAND: ssh -i /var/jenkins_home/.ssh-ro/id_rsa -o StrictHostKeyChecking=no
    command: bash -c "mkdir -p /var/jenkins_home/.ssh-ro && cp /run/ssh/id_rsa /var/jenkins_home/.ssh-ro/id_rsa && chmod 600 /var/jenkins_home/.ssh-ro/id_rsa && chown -R jenkins:jenkins /var/jenkins_home/.ssh-ro
      && /usr/bin/tini -- /usr/local/bin/jenkins.sh"
    volumes:
    - ${DATA_ROOT:-./data}/private/jenkins:/var/jenkins_home
    - ${DATA_ROOT:-./data}/public:/public
    - /var/run/docker.sock:/var/run/docker.sock
    - ${SSH_KEY_PATH:-/root/.ssh/id_rsa}:/run/ssh/id_rsa:ro
    extra_hosts:
    - git.localhost:host-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/login >/dev/null || exit 1
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 90s
networks:
  default:
    name: aisystem
    external: true
