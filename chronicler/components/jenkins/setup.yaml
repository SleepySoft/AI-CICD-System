schema_version: 1
profiles: [full]
depends_on: [gitea, caddy]
conflicts_with: []
platforms: [windows, linux, darwin]
resources: {memory_mb: 1024, disk_mb: 4096}
fields:
  - {key: JENKINS_ADMIN_ID, label: Jenkins 管理员, kind: text, required: true, default: admin}
  - key: JENKINS_ADMIN_PASSWORD
    label: Jenkins 管理员密码
    kind: secret
    secret_type: password
    required: true
    generate: password
    generate_length: 20
    rotation_risk: coordinated
    help: 登录 Jenkins 管理界面的账号密码；轮换后使用旧密码的 API 或自动化调用需要同步更新。
readiness: {kind: container-health, timeout_sec: 900}