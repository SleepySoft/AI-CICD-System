# 组件插件（ADR-0027）：一个目录装下组件的一切（SKILL.md / hooks/ 可选）
# data 声明（ADR-0026）：private=数据仅本组件挂载；public_write=交换区子目录
name: jenkins
group: 研发
desc: CI/CD 流水线（独立账号）
url: http://ci.localhost
container: aisystem-jenkins-1
visibility: all
autostart: true
critical: false
driver: docker
enabled: true
note: CI 构建结果查询（只读）
data:
  private: true
  public_write: ci
# 认证自述（巡检 verify-auth.py / 沙箱认证探针消费）
auth:
  - kind: basic
    user_field: JENKINS_ADMIN_ID
    secret_field: JENKINS_ADMIN_PASSWORD
    verify: /api/json
