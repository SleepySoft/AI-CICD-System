# gitea 组件部署定义（ADR-0027：组件目录自包含）
# 由 Chronicler 拉起：docker compose -p aisystem --env-file <repo>/.env -f <本文件> up -d；REPO_ROOT/DATA_ROOT 由 Chronicler 注入绝对路径
services:
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      USER_UID: '1000'
      USER_GID: '1000'
      GITEA__database__DB_TYPE: postgres
      GITEA__webhook__ALLOWED_HOST_LIST: '*'
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: ${POSTGRES_USER:-aisys}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:?}
      GITEA__server__DOMAIN: git.${BASE_DOMAIN:-localhost}
      GITEA__server__ROOT_URL: http://git.${BASE_DOMAIN:-localhost}/
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__packages__ENABLED: 'true'
    volumes:
    - ${DATA_ROOT:-./data}/private/gitea:/data
    - ${DATA_ROOT:-./data}/public:/public
    ports:
    - ${GITEA_SSH_PORT:-2222}:22
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3000/api/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
networks:
  aisystem:
    name: aisystem
