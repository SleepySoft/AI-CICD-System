schema_version: 1
profiles: [recommended, full]
depends_on: [postgres, keycloak]
conflicts_with: []
platforms: [windows, linux, darwin]
resources:
  memory_mb: 512
  disk_mb: 2048
fields:
  - key: GITEA_ADMIN_USER
    label: Gitea 管理员
    kind: text
    summary: account
    required: true
    default: gitea_admin
    pattern: '^(?!admin$)[A-Za-z0-9_.\-]{1,40}$'
    validation_message: Gitea 用户名不能使用保留名称 admin，只能包含字母、数字、点、下划线和连字符。
    help: Gitea 保留了 admin 名称；建议保留默认值 gitea_admin。
  - key: GITEA_ADMIN_PASSWORD
    label: Gitea 管理员密码
    kind: secret
    secret_type: password
    required: true
    generate: password
    generate_length: 20
    rotation_risk: coordinated
    help: 登录 Gitea 管理后台的账号密码，也可能被 CI 组件作为 Git 凭据使用；轮换后须同步更新所有消费者。
  - key: OIDC_GITEA_SECRET
    label: Gitea SSO 客户端秘密
    kind: secret
    secret_type: client-secret
    required: true
    generate: token
    generate_length: 40
    rotation_risk: coordinated
    help: Gitea 与身份服务之间的机器认证秘密，不是用户密码；两端必须保持相同，轮换不同步会导致 SSO 登录失败。
  - key: GITEA_SSH_PORT
    label: Gitea SSH 端口
    kind: port
    required: true
    default: 22222
    help: Git SSH 克隆映射到宿主的端口。Windows 上若端口处于 Hyper-V 排除区间会启动失败，请选择其它空闲端口。
readiness:
  kind: container-health
  timeout_sec: 240
initialize_hook: hooks/initialize.py