# qdrant 组件部署定义（ADR-0027：组件目录自包含）
# 由 Chronicler 拉起：docker compose -p aisystem --env-file <repo>/.env -f <本文件> up -d；REPO_ROOT/DATA_ROOT 由 Chronicler 注入绝对路径
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    profiles:
    - knowledge
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
    - ${DATA_ROOT:-./data}/private/qdrant:/qdrant/storage
    - ${DATA_ROOT:-./data}/public:/public
networks:
  aisystem:
    name: aisystem
