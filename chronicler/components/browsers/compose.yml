# browsers 组件部署定义（ADR-0027：组件目录自包含）
# 由 Chronicler 拉起：docker compose -p aisystem --env-file <repo>/.env -f <本文件> up -d；REPO_ROOT/DATA_ROOT 由 Chronicler 注入绝对路径
services:
  browsers:
    build: ${COMPONENTS_ROOT:-..}/browsers/image
    image: aisystem/browsers:latest
    restart: unless-stopped
    profiles:
    - browsers
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    shm_size: 2gb
networks:
  default:
    name: aisystem
    external: true
