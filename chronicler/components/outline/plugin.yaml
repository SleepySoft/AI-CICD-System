# 组件插件（ADR-0027）：一个目录装下组件的一切（SKILL.md / hooks/ 可选）
# data 声明（ADR-0026）：private=数据仅本组件挂载；public_write=交换区子目录
name: outline
group: 知识与文档
desc: 知识库 Web（knowledge profile，Keycloak 登录）
url: http://kb.localhost
container: aisystem-outline-1
visibility: all
autostart: false
critical: false
driver: docker
enabled: false
note: 知识库 Wiki
data:
  private: true
# 认证自述：sso=OIDC 全链路（巡检用 realm 测试账号 dev 真登录；沙箱无 OIDC 客户端注册，跳过）
auth:
  - kind: sso
    oidc_path: /auth/oidc
    verify: POST /api/auth.info   # outline API 全 POST；已登录 200 返回用户 JSON，未登录 401