# uptime-kuma 组件部署定义（ADR-0027：组件目录自包含）
# 由 Chronicler 拉起：docker compose -p aisystem --env-file <repo>/.env -f <本文件> up -d；REPO_ROOT/DATA_ROOT 由 Chronicler 注入绝对路径
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles:
    - monitor
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
    - ${DATA_ROOT:-./data}/private/uptime-kuma:/app/data
    - ${DATA_ROOT:-./data}/public:/public
    - /var/run/docker.sock:/var/run/docker.sock:ro
networks:
  aisystem:
    name: aisystem
