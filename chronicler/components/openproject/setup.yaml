schema_version: 1
profiles: [full]
depends_on: [postgres, caddy]
conflicts_with: []
platforms: [windows, linux, darwin]
resources: {memory_mb: 1024, disk_mb: 2048}
fields:
  - key: OPENPROJECT_SECRET_KEY_BASE
    label: OpenProject 数据加密密钥
    kind: secret
    secret_type: encryption-key
    required: true
    generate: token
    generate_length: 64
    rotation_risk: critical
    help: 用于加密和签名 OpenProject 内部数据，不是登录密码。初始化后不得直接更换，否则已有加密数据或会话可能无法恢复。
readiness: {kind: container-health, timeout_sec: 600}