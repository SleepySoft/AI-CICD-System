# terminal-runtime 组件部署定义（ADR-0027：组件目录自包含）
# 由 Chronicler 拉起：docker compose -p aisystem --env-file <repo>/.env -f <本文件> up -d；REPO_ROOT/DATA_ROOT 由 Chronicler 注入绝对路径
services:
  terminal-runtime:
    profiles:
    - sandbox
    build:
      context: ${REPO_ROOT:-../../..}
      dockerfile: ${COMPONENTS_ROOT:-..}/terminal-runtime/image/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: aisystem/terminal-runtime:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ATR_API_TOKEN: ${ATR_API_TOKEN:?ATR_API_TOKEN is required}
    volumes:
    - ${DATA_ROOT:-./data}/private/terminal-runtime:/opt/agents
    - ${DATA_ROOT:-./data}/public:/public
    - ${DATA_ROOT:-./data}/workspace:/workspace
    - ${REPO_ROOT:-../../..}/scripts/agents:/opt/agent-install:ro
    healthcheck:
      test:
      - CMD-SHELL
      - 'curl -fsS -H "Authorization: Bearer $${ATR_API_TOKEN}" http://localhost:18650/health || exit 1'
      interval: 15s
      timeout: 5s
      retries: 10
networks:
  default:
    name: aisystem
    external: true
