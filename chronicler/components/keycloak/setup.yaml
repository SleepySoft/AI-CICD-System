schema_version: 1
profiles: [recommended, full]
depends_on: [postgres, caddy]
conflicts_with: []
platforms: [windows, linux, darwin]
resources:
  memory_mb: 768
  disk_mb: 1024
fields:
  - key: KEYCLOAK_ADMIN
    label: Keycloak 管理员
    kind: text
    required: true
    default: admin
  - key: KEYCLOAK_ADMIN_PASSWORD
    label: Keycloak 管理员密码
    kind: secret
    required: true
    generate: password
  - key: OIDC_GITEA_SECRET
    label: Gitea OIDC 密钥
    kind: secret
    required: true
    generate: token
  - key: CHRONICLER_OIDC_SECRET
    label: Chronicler OIDC 密钥
    kind: secret
    required: true
    generate: token
readiness:
  kind: container-health
  timeout_sec: 300
initialize_hook: hooks/initialize.py