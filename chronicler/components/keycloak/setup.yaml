schema_version: 1
profiles: [recommended, full]
depends_on: [postgres, caddy]
conflicts_with: []
platforms: [windows, linux, darwin]
resources:
  memory_mb: 768
  disk_mb: 1024
fields:
  - key: KEYCLOAK_ADMIN
    label: Keycloak 管理员
    kind: text
    summary: account
    required: true
    default: admin
  - key: KEYCLOAK_ADMIN_PASSWORD
    label: Keycloak 管理员密码
    kind: secret
    secret_type: password
    required: true
    generate: password
    generate_length: 20
    rotation_risk: coordinated
    help: 登录 Keycloak 管理后台并供初始化 hook 调用管理 API；轮换时必须同步后台账号和部署配置。
readiness:
  kind: container-health
  timeout_sec: 300
initialize_hook: hooks/initialize.py