# 组件插件（ADR-0027）：一个目录装下组件的一切（SKILL.md / hooks/ 可选）
# data 声明（ADR-0026）：private=数据仅本组件挂载；public_write=交换区子目录
name: keycloak
group: 管理
desc: 认证中心 / 用户与权限
url: http://sso.localhost/admin
container: aisystem-keycloak-1
visibility: all
autostart: true
critical: true
driver: docker
data:
  private: false
# 认证自述：token-grant=密码授权打 token 端点验证管理账号（不打开 admin 页面）
auth:
  - kind: token-grant
    user_field: KEYCLOAK_ADMIN
    secret_field: KEYCLOAK_ADMIN_PASSWORD
    realm: master
