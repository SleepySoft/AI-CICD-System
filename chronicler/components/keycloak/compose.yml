# keycloak 组件部署定义（ADR-0027：组件目录自包含）
# 由 Chronicler 拉起：docker compose -p aisystem --env-file <repo>/.env -f <本文件> up -d；REPO_ROOT/DATA_ROOT 由 Chronicler 注入绝对路径
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command:
    - start-dev
    - --import-realm
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-aisys}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://sso.${BASE_DOMAIN:-localhost}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    volumes:
    - ${REPO_ROOT}/chronicler/components/keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test:
      - CMD-SHELL
      - exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
networks:
  aisystem:
    name: aisystem
