# 工具面板/首页注册表（FR-MGR-001、FR-ENV-003）：Chronicler 首页的数据源
# name 唯一；container 为 docker 容器名（状态探测 + admin 启停）；url 为浏览器跳转入口
# visibility: all|admin（admin 仅管理员可见）
tools:
  - name: gitea
    group: 研发
    desc: Git 仓库 / PR / Issue / 包注册表（Keycloak 登录）
    url: http://git.localhost
    container: aisystem-gitea-1
    visibility: all

  - name: jenkins
    group: 研发
    desc: CI/CD 流水线（独立账号）
    url: http://ci.localhost
    container: aisystem-jenkins-1
    visibility: all

  - name: browsers
    group: 研发
    desc: 有头浏览器工作台（noVNC，browsers profile）
    url: http://browser.localhost
    container: aisystem-browsers-1
    visibility: all

  - name: outline
    group: 知识与文档
    desc: 知识库 Web（knowledge profile，Keycloak 登录）
    url: http://kb.localhost
    container: aisystem-outline-1
    visibility: all

  - name: mkdocs
    group: 知识与文档
    desc: 结构化文档站（knowledge profile）
    url: http://docs.localhost
    container: aisystem-mkdocs-1
    visibility: all

  - name: qdrant
    group: 知识与文档
    desc: 向量库控制台（knowledge profile）
    url: http://vectors.localhost/dashboard
    container: aisystem-qdrant-1
    visibility: admin

  - name: openproject
    group: 管理
    desc: 需求管理（requirements profile，独立账号）
    url: http://req.localhost
    container: aisystem-openproject-1
    visibility: all

  - name: uptime-kuma
    group: 管理
    desc: 状态监控（monitor profile）
    url: http://status.localhost
    container: aisystem-uptime-kuma-1
    visibility: admin

  - name: keycloak
    group: 管理
    desc: 认证中心 / 用户与权限
    url: http://sso.localhost/admin
    container: aisystem-keycloak-1
    visibility: admin

  - name: ollama
    group: 管理
    desc: 本地模型（localai profile）
    url: http://llm.localhost
    container: aisystem-ollama-1
    visibility: admin

  - name: terminal-runtime
    group: 平台
    desc: ATR 终端运行时（sandbox profile，可选隔离沙箱）
    url: http://term.localhost/ui
    container: aisystem-terminal-runtime-1
    visibility: admin

  - name: postgres
    group: 平台
    desc: 共享数据库
    container: aisystem-postgres-1
    visibility: admin

  - name: redis
    group: 平台
    desc: 缓存
    container: aisystem-redis-1
    visibility: admin

  - name: caddy
    group: 平台
    desc: 统一入口反向代理
    container: aisystem-caddy-1
    visibility: admin
