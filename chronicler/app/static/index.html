<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronicler</title>
  <link rel="stylesheet" href="/vendor/element-plus.css" />
  <style>
    body { margin: 0; background: #f5f7fa; font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; background: #fff; border-bottom: 1px solid #e4e7ed; }
    .header .title { font-size: 17px; font-weight: 600; color: #303133; }
    .main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    .group-title { color: #909399; font-size: 14px; margin: 22px 0 10px; }
    .tool-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 8px; padding: 14px 16px; height: 100%; box-sizing: border-box; }
    .tool-name { font-weight: 600; color: #303133; display: flex; align-items: center; gap: 8px; }
    .tool-desc { color: #909399; font-size: 12px; margin: 8px 0 12px; min-height: 32px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.running { background: #67c23a; } .dot.stopped { background: #909399; }
    .dot.absent { background: #e6a23c; } .dot.unknown { background: #f56c6c; }
    .login-page { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card-box { background: #fff; border: 1px solid #e4e7ed; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
    .log-view { background: #1e1e1e; color: #d4d4d4; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.35; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; overflow: auto; height: 60vh; margin: 0; }
    .mono textarea { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
    .muted { color: #909399; font-size: 12px; }
    @keyframes run-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .run-blink { animation: run-blink 1.8s ease-in-out infinite; }
    @keyframes run-row-pulse { 0%,100% { background-color: transparent; } 50% { background-color: rgba(64,158,255,0.14); } }
    .el-table .run-row-active > td.el-table__cell { animation: run-row-pulse 2.4s ease-in-out infinite; }
  </style>
</head>
<body>
<div id="app">
  <!-- 未登录 -->
  <div v-if="!user" class="login-page">
    <el-card style="width: 380px">
      <h2 style="text-align:center; margin-top:0">Chronicler</h2>
      <p class="muted" style="text-align:center">AI 研发任务编排与执行监督</p>
      <template v-if="authBackend === 'oidc'">
        <el-button type="primary" style="width:100%" @click="ssoLogin">通过 Keycloak 统一登录</el-button>
        <div style="text-align:center; margin-top:12px">
          <el-link type="info" size="small" @click="showLocalLogin = !showLocalLogin">
            {{ showLocalLogin ? '收起' : '本地应急账号登录' }}
          </el-link>
        </div>
      </template>
      <el-form v-if="authBackend !== 'oidc' || showLocalLogin" label-position="top" @submit.prevent style="margin-top:8px">
        <el-form-item label="用户名"><el-input v-model="loginForm.username" @keyup.enter="login"></el-input></el-form-item>
        <el-form-item label="密码"><el-input v-model="loginForm.password" type="password" show-password @keyup.enter="login"></el-input></el-form-item>
        <el-button type="primary" style="width:100%" @click="login" :loading="loading">登录</el-button>
      </el-form>
      <p v-if="loginError" style="color:#f56c6c; font-size:12px">{{ loginError }}</p>
    </el-card>
  </div>

  <!-- 已登录 -->
  <template v-else>
    <div class="header">
      <span class="title">📜 Chronicler</span>
      <span>
        <el-tag :type="isAdmin ? 'danger' : 'info'" size="small" effect="plain">{{ user.role }}</el-tag>
        <span style="margin: 0 12px 0 8px">{{ user.username }}</span>
        <el-button size="small" @click="logout">登出</el-button>
      </span>
    </div>
    <div class="main">
      <el-tabs v-model="tab" @tab-change="onTabChange">
        <!-- ============ 首页（统一门户导航，吸收原 homepage 职责） ============ -->
        <el-tab-pane label="首页" name="home">
          <div style="margin-bottom: 8px">
            <el-button size="small" @click="loadTools" :loading="loadingTools">刷新状态</el-button>
          </div>
          <div v-for="(items, group) in groupedTools" :key="group">
            <div class="group-title">{{ group }}</div>
            <el-row :gutter="14">
              <el-col :span="8" v-for="t in items" :key="t.name" style="margin-bottom:14px">
                <div class="tool-card">
                  <div class="tool-name">
                    <span class="dot" :class="t.status"></span>{{ t.desc || t.name }}
                    <el-tag v-if="t.critical" size="small" type="danger" effect="plain">关键</el-tag>
                    <span v-if="isAdmin && t.driver==='docker'" style="margin-left:auto; font-size:12px; color:#909399">
                      自启 <el-switch :model-value="t.autostart" size="small" @change="v => toggleAutostart(t, v)"></el-switch>
                    </span>
                  </div>
                  <div class="tool-desc">{{ t.name }} · {{ toolStatusText(t) }}</div>
                  <el-button v-if="t.url" size="small" type="primary" plain @click="open(t.url)">打开</el-button>
                  <el-button size="small" text @click="openToolLogs(t)">日志</el-button>
                  <el-button size="small" text @click="openToolDetail(t)">详情</el-button>
                  <template v-if="isAdmin && t.driver==='docker'">
                    <el-button v-if="t.status==='absent'" size="small" type="primary" plain @click="ctlTool(t,'deploy')">部署</el-button>
                    <el-button v-if="t.status==='stopped'" size="small" type="success" plain @click="ctlTool(t,'start')">启动</el-button>
                    <el-button v-if="t.status==='running'" size="small" type="warning" plain @click="ctlTool(t,'stop')">停止</el-button>
                    <el-button v-if="t.status==='running'" size="small" plain @click="ctlTool(t,'restart')">重启</el-button>
                  </template>
                </div>
              </el-col>
            </el-row>
          </div>
          <p v-if="!tools.length" class="muted">暂无工具</p>
        </el-tab-pane>

        <!-- ============ 工程 ============ -->
        <el-tab-pane label="工程" name="projects">
          <div style="margin-bottom: 8px">
            <el-button size="small" @click="loadProjects" :loading="loadingProjects">刷新</el-button>
            <el-button v-if="isAdmin" size="small" type="primary" @click="showNewProject = true">新建工程</el-button>
          </div>
          <el-table :data="projects" size="small" style="width:100%">
            <el-table-column type="expand">
              <template #default="{ row: p }">
                <div style="padding: 4px 16px 12px 48px">
                  <div class="group-title" style="margin: 8px 0 6px">任务（{{ tasksOfProject(p.id).length }}）— 展开即执行</div>
                  <el-table :data="tasksOfProject(p.id)" size="small" style="width:100%">
                    <el-table-column prop="name" label="任务名" width="220" show-overflow-tooltip></el-table-column>
                    <el-table-column prop="task_type" label="类型" width="160" show-overflow-tooltip></el-table-column>
                    <el-table-column label="调度 cron" width="150">
                      <template #default="{ row }">
                        <span style="font-family:Consolas,monospace">{{ row.schedule_cron || '（手动）' }}</span>
                      </template>
                    </el-table-column>
                    <el-table-column label="启用" width="90">
                      <template #default="{ row }">
                        <el-tag :type="row.enabled ? 'success' : 'info'" size="small">{{ row.enabled ? '启用' : '停用' }}</el-tag>
                      </template>
                    </el-table-column>
                    <el-table-column label="操作">
                      <template #default="{ row }">
                        <el-button size="small" type="primary" plain @click="triggerTask(row)">执行</el-button>
                        <el-button v-if="isAdmin" size="small" text @click="openTaskEdit(row)">编辑</el-button>
                        <el-button v-if="isAdmin" size="small" text type="danger" @click="removeTask(row)">删除</el-button>
                      </template>
                    </el-table-column>
                  </el-table>
                  <p v-if="!tasksOfProject(p.id).length" class="muted" style="padding: 8px 0">该工程暂无任务定义，可到「任务」页新建。</p>
                </div>
              </template>
            </el-table-column>
            <el-table-column prop="name" label="名称" width="140"></el-table-column>
            <el-table-column prop="git_url" label="Git 地址" width="300" show-overflow-tooltip></el-table-column>
            <el-table-column label="最近提交" width="200">
              <template #default="{ row }">
                <el-tooltip v-if="row.last_commit" :content="row.last_commit.subject" placement="top">
                  <span style="font-family:Consolas,monospace; font-size:12px">{{ row.last_commit.hash }} · {{ row.last_commit.date }}</span>
                </el-tooltip>
                <span v-else class="muted">—</span>
              </template>
            </el-table-column>
            <el-table-column label="最后同步" width="180">
              <template #default="{ row }">
                <el-tooltip v-if="row.last_sync_error" :content="'同步失败：' + row.last_sync_error" placement="top">
                  <span style="color:#f56c6c">⚠ 同步失败</span>
                </el-tooltip>
                <span v-else-if="row.last_synced_at">{{ fmtTime(row.last_synced_at) }}</span>
                <span v-else-if="row.synced" class="muted">待同步</span>
                <span v-else class="muted">从未同步</span>
              </template>
            </el-table-column>
            <el-table-column label="创建时间" width="170">
              <template #default="{ row }">{{ fmtTime(row.created_at) }}</template>
            </el-table-column>
            <el-table-column v-if="isAdmin" label="操作" width="190" align="center">
              <template #default="{ row }">
                <el-tooltip content="同步（拉取最新代码）" placement="top"><el-button size="small" text type="primary" icon="Refresh" @click="syncProject(row)"></el-button></el-tooltip>
                <el-tooltip content="重置克隆（删本地重新拉）" placement="top"><el-button size="small" text type="warning" icon="RefreshLeft" @click="resetClone(row)"></el-button></el-tooltip>
                <el-tooltip content="设置" placement="top"><el-button size="small" text icon="Setting" @click="openEdit(row)"></el-button></el-tooltip>
                <el-tooltip content="删除工程" placement="top"><el-button size="small" text type="danger" icon="Delete" @click="removeProject(row)"></el-button></el-tooltip>
              </template>
            </el-table-column>
          </el-table>
          <p v-if="!projects.length" class="muted">暂无工程</p>
        </el-tab-pane>

        <!-- ============ 任务 ============ -->
        <el-tab-pane label="任务" name="runs">
          <div class="group-title" style="margin-top:0">任务定义</div>
          <div style="margin-bottom: 8px">
            <el-button size="small" @click="loadTasks" :loading="loadingTasks">刷新</el-button>
            <el-button v-if="isAdmin" size="small" type="primary" @click="openNewTask">新建任务</el-button>
            <el-select v-model="taskFilter" placeholder="全部工程" clearable size="small" style="width:200px; margin-left:10px">
              <el-option v-for="p in projects" :key="p.id" :label="p.name" :value="p.id"></el-option>
            </el-select>
          </div>
          <div v-for="g in groupedTaskDefs" :key="g.project_id" style="margin-bottom:16px">
            <div class="group-title" style="margin: 14px 0 8px">工程：{{ g.project_name }}（{{ g.tasks.length }}）</div>
            <el-table :data="g.tasks" size="small" style="width:100%">
              <el-table-column prop="name" label="任务名" width="180" show-overflow-tooltip></el-table-column>
              <el-table-column prop="task_type" label="类型" width="150" show-overflow-tooltip></el-table-column>
              <el-table-column label="Harness" width="110">
                <template #default="{ row }">
                  <el-tag v-if="row.harness" size="small" type="warning" effect="plain">{{ row.harness }}</el-tag>
                  <span v-else class="muted">默认</span>
                </template>
              </el-table-column>
              <el-table-column label="调度 cron" width="140">
                <template #default="{ row }">
                  <span style="font-family:Consolas,monospace">{{ row.schedule_cron || '（手动）' }}</span>
                </template>
              </el-table-column>
              <el-table-column label="工作目录" width="100">
                <template #default="{ row }">
                  <el-tag v-if="row.cwd" size="small" type="warning" effect="plain">{{ row.cwd }}</el-tag>
                  <span v-else class="muted">默认</span>
                </template>
              </el-table-column>
              <el-table-column label="启用" width="80">
                <template #default="{ row }">
                  <el-switch v-if="isAdmin" :model-value="!!row.enabled" size="small" @change="v => toggleTaskEnabled(row, v)"></el-switch>
                  <el-tag v-else :type="row.enabled ? 'success' : 'info'" size="small">{{ row.enabled ? '启用' : '停用' }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="创建时间" width="160">
                <template #default="{ row }">{{ fmtTime(row.created_at) }}</template>
              </el-table-column>
              <el-table-column v-if="isAdmin" label="操作" width="180">
                <template #default="{ row }">
                  <el-button size="small" text type="primary" @click="triggerTask(row)">触发</el-button>
                  <el-button size="small" text @click="openTaskEdit(row)">编辑</el-button>
                  <el-button size="small" text type="danger" @click="removeTask(row)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
          <p v-if="!groupedTaskDefs.length" class="muted">暂无任务定义</p>

          <div class="group-title">执行记录（Run）</div>
          <div style="margin-bottom: 8px; display:flex; gap:10px; align-items:center">
            <el-select v-model="runFilter" placeholder="全部工程" clearable size="small" style="width:200px" @change="loadRuns">
              <el-option v-for="p in projects" :key="p.id" :label="p.name" :value="p.id"></el-option>
            </el-select>
            <el-button size="small" @click="loadRuns" :loading="loadingRuns">刷新</el-button>
            <el-button v-if="isAdmin" size="small" type="primary" @click="openTrigger">触发任务</el-button>
          </div>
          <el-table :data="runs" size="small" style="width:100%" :row-class-name="runRowClass">
            <el-table-column prop="id" label="ID" width="70"></el-table-column>
            <el-table-column label="工程" width="140">
              <template #default="{ row }">{{ projectName(row.project_id) }}</template>
            </el-table-column>
            <el-table-column prop="task_type" label="任务类型" width="140"></el-table-column>
            <el-table-column label="状态" width="90">
              <template #default="{ row }">
                <el-tag :type="runTagType(row.status)" size="small"
                        :class="{ 'run-blink': row.status === 'running' || row.status === 'queued' }">
                  {{ runStatusText(row.status) }}
                </el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="harness" label="Harness" width="110" show-overflow-tooltip></el-table-column>
            <el-table-column label="开始时间" width="160">
              <template #default="{ row }">{{ fmtTime(row.started_at) }}</template>
            </el-table-column>
            <el-table-column prop="error" label="错误" show-overflow-tooltip></el-table-column>
            <el-table-column label="操作" width="200">
              <template #default="{ row }">
                <div style="white-space:nowrap">
                  <el-button size="small" text type="primary" @click="openLog(row)">日志</el-button>
                  <el-button size="small" text @click="openRunPrompt(row)">提示词</el-button>
                  <el-button size="small" text @click="openReport(row)">报告</el-button>
                </div>
              </template>
            </el-table-column>
          </el-table>
          <p v-if="!runs.length" class="muted">暂无任务</p>
        </el-tab-pane>

        <!-- ============ 配置 ============ -->
        <el-tab-pane label="配置" name="config">
          <div class="group-title">全局默认 Harness</div>
          <div class="card-box" style="max-width:640px">
            <div class="tool-desc">任务未设置工程级覆盖时使用的 agent（FR-MGR-020）。注意：若某工程在「工程设置 → Agent harness 覆盖」配置了值，该工程以工程覆盖为准，不受这里影响。</div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <el-select v-model="defaultHarness" :disabled="!isAdmin" style="flex:1">
                <el-option v-for="h in harnesses" :key="h.name" :label="h.name + ' — ' + h.desc" :value="h.name"></el-option>
              </el-select>
              <el-button v-if="isAdmin" type="primary" @click="saveDefaultHarness" :loading="acting">保存默认</el-button>
            </div>
          </div>
          <div class="group-title">Harness 列表</div>
          <div v-if="isAdmin" style="margin-bottom:10px">
            <el-button size="small" type="primary" plain @click="openHarnessForm(null)">+ 新增 Harness</el-button>
          </div>
          <div class="card-box" v-for="h in harnesses" :key="h.name">
            <div class="tool-name">{{ h.name }}
              <el-tag v-if="h.stdin_prompt" size="small" type="success" effect="plain">stdin</el-tag>
              <el-tag size="small" type="info" effect="plain">报告:{{ h.report_mode === 'stdout' ? 'stdout' : '文件' }}</el-tag>
              <el-tag size="small" type="info" effect="plain">cwd:{{ h.cwd }}</el-tag>
              <el-tag size="small" type="info" effect="plain">超时 {{ h.timeout_sec }}s</el-tag>
              <span v-if="isAdmin" style="float:right">
                <el-button size="small" text type="primary" @click="openHarnessForm(h)">编辑</el-button>
                <el-button size="small" text type="danger" @click="removeHarness(h)">删除</el-button>
              </span>
            </div>
            <div class="tool-desc">{{ h.desc }}</div>
            <div class="muted" style="font-family:Consolas,monospace">{{ h.command_template }}</div>
            <div style="margin-top:6px">
              <el-tag v-for="k in h.env_keys" :key="k" size="small" type="warning" effect="plain" style="margin-right:6px">{{ k }}</el-tag>
            </div>
          </div>
          <div class="group-title">组件</div>
          <el-table :data="componentList" size="small" style="width:100%">
            <el-table-column prop="name" label="名称" width="160"></el-table-column>
            <el-table-column label="启用" width="80">
              <template #default="{ row }">
                <el-tag :type="row.enabled ? 'success' : 'info'" size="small">{{ row.enabled ? '启用' : '停用' }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="url" label="地址" width="260" show-overflow-tooltip></el-table-column>
            <el-table-column prop="note" label="备注" show-overflow-tooltip></el-table-column>
          </el-table>
          <div class="group-title">提示词</div>
          <el-table :data="prompts" size="small" style="width:100%">
            <el-table-column prop="task_type" label="任务类型" width="200"></el-table-column>
            <el-table-column prop="version" label="版本" width="120"></el-table-column>
            <el-table-column label="已被覆盖" width="100">
              <template #default="{ row }">
                <el-tag :type="row.overridden ? 'warning' : 'info'" size="small">{{ row.overridden ? '是' : '否' }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="size" label="大小(字节)" width="120"></el-table-column>
            <el-table-column label="操作" width="110">
              <template #default="{ row }">
                <el-button size="small" text type="primary" @click="openPrompt(row)">{{ isAdmin ? '查看/编辑' : '查看' }}</el-button>
              </template>
            </el-table-column>
          </el-table>
          <p class="muted" style="margin-top:16px">配置为 YAML 文件，改文件即热生效。</p>
        </el-tab-pane>

        <!-- ============ 用户（admin） ============ -->
        <el-tab-pane v-if="isAdmin" label="用户" name="users">
          <el-alert v-if="authBackend === 'oidc'" type="info" :closable="false" style="margin-bottom:12px"
                    title="账号由 Keycloak 统一管理：请到 sso.localhost/admin 增删用户与调整分组（boss 组 = 本系统 admin）。下表为首次登录自动建档的同步记录，仅可查看。"></el-alert>
          <div v-if="authBackend !== 'oidc'" class="card-box" style="max-width:560px">
            <div class="tool-name" style="margin-bottom:10px">新建用户</div>
            <el-form inline size="small">
              <el-form-item><el-input v-model="newUser.username" placeholder="用户名"></el-input></el-form-item>
              <el-form-item><el-input v-model="newUser.password" type="password" placeholder="密码"></el-input></el-form-item>
              <el-form-item>
                <el-select v-model="newUser.role" style="width:110px">
                  <el-option label="admin" value="admin"></el-option><el-option label="user" value="user"></el-option>
                </el-select>
              </el-form-item>
              <el-form-item><el-button type="primary" @click="createUser" :loading="acting">创建</el-button></el-form-item>
            </el-form>
          </div>
          <el-table :data="users" size="small" style="width:100%">
            <el-table-column prop="id" label="ID" width="70"></el-table-column>
            <el-table-column prop="username" label="用户名" width="200"></el-table-column>
            <el-table-column label="角色" width="120">
              <template #default="{ row }">
                <el-tag :type="row.role==='admin' ? 'danger' : 'info'" size="small" effect="plain">{{ row.role }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="来源" width="100">
              <template #default="{ row }">
                <el-tag :type="row.source==='oidc' ? 'success' : 'warning'" size="small" effect="plain">{{ row.source === 'oidc' ? 'Keycloak' : '本地' }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="创建时间" width="180">
              <template #default="{ row }">{{ fmtTime(row.created_at) }}</template>
            </el-table-column>
            <el-table-column label="操作">
              <template #default="{ row }">
                <el-button v-if="authBackend === 'oidc'" size="small" text type="warning" @click="openResetPw(row)">重置密码</el-button>
                <el-button v-else size="small" text type="danger" @click="removeUser(row)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
        </el-tab-pane>
      </el-tabs>
    </div>

    <!-- 新建工程 -->
    <el-dialog v-model="showNewProject" title="新建工程" width="560px">
      <el-form label-position="top" size="small">
        <el-form-item label="名称（小写字母/数字/-/_）"><el-input v-model="newProject.name" placeholder="my-project"></el-input></el-form-item>
        <el-form-item label="Git 地址（工程核心：任意 git 远端或本地路径）"><el-input v-model="newProject.git_url" placeholder="http://git.localhost/team/repo.git 或 C:\\path\\to\\repo"></el-input></el-form-item>
        <el-form-item label="默认分支（留空=远端默认）"><el-input v-model="newProject.default_branch" placeholder="main"></el-input></el-form-item>
        <el-form-item label="CI 项目链接（可选，复杂项目关联 Jenkins job 等）"><el-input v-model="newProject.ci_url" placeholder="http://ci.localhost/job/xxx"></el-input></el-form-item>
        <el-form-item label="Agent harness 覆盖（留空=全局默认）">
          <el-select v-model="newProject.harness" clearable placeholder="全局默认" style="width:100%">
            <el-option v-for="h in harnesses" :key="h.name" :label="h.name + ' — ' + h.desc" :value="h.name"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="描述"><el-input v-model="newProject.description" type="textarea" :rows="2"></el-input></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="showNewProject = false">取消</el-button>
        <el-button type="primary" @click="createProject" :loading="acting">创建</el-button>
      </template>
    </el-dialog>

    <!-- 工程设置（全字段表单；高级覆盖项 JSON 收起） -->
    <el-dialog v-model="showEdit" :title="'工程设置 - ' + (editProject?.name || '')" width="560px">
      <el-form label-position="top" size="small">
        <el-form-item label="Git 地址"><el-input v-model="editForm.git_url"></el-input></el-form-item>
        <el-form-item label="默认分支（留空=远端默认）"><el-input v-model="editForm.default_branch"></el-input></el-form-item>
        <el-form-item label="CI 项目链接"><el-input v-model="editForm.ci_url" placeholder="http://ci.localhost/job/xxx/job/main"></el-input></el-form-item>
        <el-form-item label="Shadow 库地址（留空=自动本地建库；FR-MGR-013）"><el-input v-model="editForm.shadow_repo" placeholder="http://git.localhost/<owner>/<name>-shadow.git"></el-input></el-form-item>
        <el-form-item label="描述"><el-input v-model="editForm.description" type="textarea" :rows="2"></el-input></el-form-item>
        <el-form-item label="Agent harness 覆盖">
          <el-select v-model="editForm.harness" clearable placeholder="全局默认" style="width:100%">
            <el-option v-for="h in harnesses" :key="h.name" :label="h.name + ' — ' + h.desc" :value="h.name"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item>
          <el-checkbox v-model="editForm.showAdv">高级覆盖项（JSON，如分析策略）</el-checkbox>
        </el-form-item>
        <el-form-item v-if="editForm.showAdv">
          <el-input v-model="editForm.overridesText" type="textarea" :rows="6" placeholder="{}"></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="showEdit = false">取消</el-button>
        <el-button type="primary" @click="saveEdit" :loading="acting">保存</el-button>
      </template>
    </el-dialog>

    <!-- Harness 编辑（新增/编辑，admin；写入 DATA 覆盖 harness.yaml） -->
    <el-dialog v-model="showHarnessForm" :title="editingHarnessName ? '编辑 Harness - ' + editingHarnessName : '新增 Harness'" width="720px">
      <el-form label-position="top" size="small">
        <el-form-item label="name（唯一标识，英数/连字符/下划线，保存后不可改）">
          <el-input v-model="harnessForm.name" :disabled="!!editingHarnessName" placeholder="my-agent"></el-input>
        </el-form-item>
        <el-form-item label="desc（一句话描述）"><el-input v-model="harnessForm.desc"></el-input></el-form-item>
        <el-form-item label="command_template（shell 执行，cwd 见下方；变量 {prompt_file} {report_file} {repo_dir} {shadow_dir}）">
          <el-input v-model="harnessForm.command_template" type="textarea" :rows="3"
                    placeholder="codex exec --skip-git-repo-check --sandbox read-only -C {repo_dir} -o {report_file}"></el-input>
        </el-form-item>
        <el-form-item label="prompt 传入方式">
          <el-radio-group v-model="harnessForm.prompt_mode">
            <el-radio-button label="stdin">stdin 管道</el-radio-button>
            <el-radio-button label="file">{prompt_file} 文件</el-radio-button>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="报告产出方式">
          <el-radio-group v-model="harnessForm.report_mode">
            <el-radio-button label="file">harness 写 {report_file}</el-radio-button>
            <el-radio-button label="stdout">supervisor 捕获 stdout</el-radio-button>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="工作目录">
          <el-radio-group v-model="harnessForm.cwd">
            <el-radio-button label="repo">工程仓库</el-radio-button>
            <el-radio-button label="shadow">shadow 库</el-radio-button>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="超时（秒）"><el-input-number v-model="harnessForm.timeout_sec" :min="10" :step="60"></el-input-number></el-form-item>
        <el-form-item label="环境变量（值含 ${VAR} 时从 supervisor 进程环境解析，密钥不落明文；编辑时已有键值不回显，留空=保持原值）">
          <div v-for="(row, i) in harnessForm.env" :key="i" style="display:flex;gap:6px;margin-bottom:6px;width:100%">
            <el-input v-model="row.key" placeholder="VAR_NAME" style="width:220px"></el-input>
            <el-input v-model="row.value" placeholder="值、${VAR} 引用或留空保持原值" style="flex:1"></el-input>
            <el-button @click="harnessForm.env.splice(i,1)">-</el-button>
          </div>
          <el-button size="small" text type="primary" @click="harnessForm.env.push({key:'',value:''})">+ 环境变量</el-button>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="showHarnessForm = false">取消</el-button>
        <el-button type="primary" @click="saveHarness" :loading="acting">保存</el-button>
      </template>
    </el-dialog>

    <!-- 新建任务 -->
    <el-dialog v-model="showNewTask" title="新建任务" width="520px">
      <el-form label-position="top" size="small">
        <el-form-item label="工程">
          <el-select v-model="newTaskForm.project_id" style="width:100%">
            <el-option v-for="p in projects" :key="p.id" :label="p.name" :value="p.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="任务名称"><el-input v-model="newTaskForm.name" placeholder="每日代码洞察"></el-input></el-form-item>
        <el-form-item label="任务类型">
          <el-select v-model="newTaskForm.task_type" style="width:100%" placeholder="选择预置模板">
            <el-option v-for="p in prompts" :key="p.task_type" :label="p.task_type + '（' + p.version + '）'" :value="p.task_type"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="Agent harness 覆盖（留空=工程覆盖/全局默认，任务级优先）">
          <el-select v-model="newTaskForm.harness" clearable placeholder="默认（工程/全局）" style="width:100%">
            <el-option v-for="h in harnesses" :key="h.name" :label="h.name + ' — ' + h.desc" :value="h.name"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="工作目录（留空=harness 默认；repo=工程仓库，shadow=shadow 库）">
          <el-select v-model="newTaskForm.cwd" clearable placeholder="harness 默认" style="width:100%">
            <el-option label="repo（工程仓库）" value="repo"></el-option>
            <el-option label="shadow（shadow 库）" value="shadow"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="调度 cron（留空=仅手动触发）"><el-input v-model="newTaskForm.schedule_cron" placeholder="0 9 * * *"></el-input></el-form-item>
        <el-form-item label="启用"><el-switch v-model="newTaskForm.enabled"></el-switch></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="showNewTask = false">取消</el-button>
        <el-button type="primary" @click="createTask" :loading="acting">创建</el-button>
      </template>
    </el-dialog>

    <!-- 编辑任务 -->
    <el-dialog v-model="showTaskEdit" :title="'编辑任务 - ' + (taskEditRow?.name || '')" width="600px">
      <el-form label-position="top" size="small">
        <el-form-item label="任务名称"><el-input v-model="taskEditForm.name"></el-input></el-form-item>
        <el-form-item label="Agent harness 覆盖（留空=工程覆盖/全局默认，任务级优先）">
          <el-select v-model="taskEditForm.harness" clearable placeholder="默认（工程/全局）" style="width:100%">
            <el-option v-for="h in harnesses" :key="h.name" :label="h.name + ' — ' + h.desc" :value="h.name"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="工作目录（留空=harness 默认；repo=工程仓库，shadow=shadow 库）">
          <el-select v-model="taskEditForm.cwd" clearable placeholder="harness 默认" style="width:100%">
            <el-option label="repo（工程仓库）" value="repo"></el-option>
            <el-option label="shadow（shadow 库）" value="shadow"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="调度 cron（留空=仅手动触发）"><el-input v-model="taskEditForm.schedule_cron" placeholder="0 9 * * *"></el-input></el-form-item>
        <el-form-item label="启用"><el-switch v-model="taskEditForm.enabled"></el-switch></el-form-item>
        <el-form-item label="Webhook（预留，暂未开放）">
          <el-input v-model="taskEditForm.webhook" disabled placeholder="预留字段"></el-input>
        </el-form-item>
        <el-form-item :label="'Prompt 覆盖（留空=使用全局模板）'">
          <el-input v-model="taskEditForm.prompt_override" type="textarea" :rows="10" class="mono"
                    placeholder="留空则使用全局模板"></el-input>
          <div class="muted" style="margin-top:4px">{{ taskPromptSource }}</div>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="showTaskEdit = false">取消</el-button>
        <el-button type="primary" @click="saveTaskEdit" :loading="acting">保存</el-button>
      </template>
    </el-dialog>

    <!-- 提示词查看/编辑 -->
    <el-drawer v-model="showPrompt" :title="'提示词 - ' + promptView.task_type" size="60%">
      <div style="margin-bottom:10px">
        <el-tag size="small" effect="plain">版本 {{ promptView.version }}</el-tag>
        <el-tag :type="promptView.overridden ? 'warning' : 'info'" size="small" style="margin-left:8px">
          {{ promptView.overridden ? '已覆盖内置' : '内置模板' }}
        </el-tag>
      </div>
      <el-input v-model="promptView.content" type="textarea" :rows="22" :readonly="!isAdmin" class="mono"></el-input>
      <div v-if="isAdmin" style="margin-top:12px">
        <el-button type="primary" @click="savePrompt" :loading="acting">保存为覆盖副本</el-button>
        <el-button v-if="promptView.overridden" type="warning" plain @click="resetPrompt">恢复内置</el-button>
      </div>
      <p v-if="!isAdmin" class="muted" style="margin-top:12px">只读：仅管理员可编辑提示词。</p>
    </el-drawer>

    <!-- 触发任务 -->
    <el-dialog v-model="showTrigger" title="触发任务" width="520px">
      <el-form label-position="top" size="small">
        <el-form-item label="工程">
          <el-select v-model="triggerForm.project_id" style="width:100%">
            <el-option v-for="p in projects" :key="p.id" :label="p.name" :value="p.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="任务类型">
          <el-select v-model="triggerForm.task_type" style="width:100%">
            <el-option v-for="p in prompts" :key="p.task_type" :label="p.task_type + '（' + p.version + '）'" :value="p.task_type"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="附加提示（可选）"><el-input v-model="triggerForm.extra_prompt" type="textarea" :rows="4"></el-input></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="showTrigger = false">取消</el-button>
        <el-button type="primary" @click="triggerRun" :loading="acting">触发</el-button>
      </template>
    </el-dialog>

    <!-- 日志 -->
    <el-dialog v-model="showLog" :title="'任务 #' + logRunId + ' 日志'" width="80%" top="6vh" @close="stopLogPoll">
      <pre class="log-view">{{ logText || '（暂无日志）' }}</pre>
    </el-dialog>

    <!-- 报告 -->
    <el-dialog v-model="showReport" :title="'任务 #' + reportRunId + ' 报告'" width="80%" top="6vh">
      <pre class="log-view">{{ reportText }}</pre>
    </el-dialog>

    <!-- 本次执行的提示词（A 段快照） -->
    <el-dialog v-model="showRunPrompt" :title="'任务 #' + runPromptId + ' 本次提示词'" width="80%" top="6vh">
      <pre class="log-view">{{ runPromptText || '（暂无记录）' }}</pre>
    </el-dialog>

    <!-- 重置密码（OIDC 模式管理员通道） -->
    <el-dialog v-model="showResetPw" :title="'重置密码 - ' + resetPwUser" width="420px">
      <el-form label-position="top" size="small">
        <el-form-item label="新密码（至少 6 位）">
          <el-input v-model="resetPwForm.password" type="password" show-password></el-input>
        </el-form-item>
        <el-checkbox v-model="resetPwForm.temporary">临时密码（用户下次登录须改密，推荐）</el-checkbox>
      </el-form>
      <template #footer>
        <el-button @click="showResetPw = false">取消</el-button>
        <el-button type="primary" @click="doResetPw" :loading="acting">重置</el-button>
      </template>
    </el-dialog>

    <!-- 组件部署（实时进度） -->
    <el-dialog v-model="showDeploy" :title="'部署 ' + deployName" width="70%" top="8vh" @close="closeDeploy">
      <template #header>
        <span>部署 {{ deployName }}</span>
        <el-tag :type="deployState === 'running' ? 'primary' : (deployState === 'done' ? 'success' : 'danger')"
                size="small" style="margin-left:10px">
          {{ { running: '部署中', done: '完成', error: '失败', idle: '空闲' }[deployState] }}
        </el-tag>
      </template>
      <pre class="log-view">{{ deployLines.join('\n') || '启动中…' }}</pre>
    </el-dialog>

    <!-- 组件日志 -->
    <el-dialog v-model="showToolLog" :title="toolLogName + ' 日志'" width="80%" top="6vh">
      <template #header><span>{{ toolLogName }} 日志</span>
        <el-button size="small" style="float:right" @click="refreshToolLogs">刷新</el-button></template>
      <pre class="log-view">{{ toolLogText || '（暂无日志）' }}</pre>
    </el-dialog>

    <!-- 组件详情 -->
    <el-dialog v-model="showToolDetail" :title="(toolDetail?.desc || toolDetail?.name || '') + ' 详情'" width="560px">
      <el-descriptions v-if="toolDetail" :column="1" border size="small">
        <el-descriptions-item label="名称">{{ toolDetail.name }}</el-descriptions-item>
        <el-descriptions-item label="状态">{{ toolStatusText(toolDetail) }}</el-descriptions-item>
        <el-descriptions-item label="自启">{{ toolDetail.autostart ? '开' : '关' }}</el-descriptions-item>
        <template v-if="toolDetail.detail">
          <el-descriptions-item label="镜像">{{ toolDetail.detail.image }}</el-descriptions-item>
          <el-descriptions-item label="启动时间">{{ toolDetail.detail.started_at }}</el-descriptions-item>
          <el-descriptions-item label="运行时长">{{ fmtUptime(toolDetail.detail.uptime_sec) }}</el-descriptions-item>
          <el-descriptions-item label="健康">{{ toolDetail.detail.health || '（无健康检查）' }}</el-descriptions-item>
          <el-descriptions-item label="重启次数">{{ toolDetail.detail.restart_count }}</el-descriptions-item>
          <el-descriptions-item label="端口"><span style="font-family:Consolas,monospace; font-size:12px">{{ fmtPorts(toolDetail.detail.ports) }}</span></el-descriptions-item>
        </template>
      </el-descriptions>
    </el-dialog>
  </template>
</div>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.min.js"></script>
<script src="/vendor/icons.iife.min.js"></script>
<script src="/app.js?v=6"></script>
</body>
</html>
