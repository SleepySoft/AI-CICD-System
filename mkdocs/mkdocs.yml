site_name: AISystem 结构化软件文档
site_description: 由 Agent 定时分析代码自动生成的结构化文档
docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.top
    - search.suggest

plugins:
  - search:
      lang: zh
  - awesome-pages        # 按目录结构自动导航（shadow 内容无需手工注册）

# 不设静态 nav：全部交给 awesome-pages 按目录生成
