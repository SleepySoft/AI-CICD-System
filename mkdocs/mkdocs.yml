site_name: AISystem 结构化软件文档
site_description: 由 Agent 定时分析代码自动生成的结构化文档
docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.top
    - search.suggest

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  # 工程分析报告在 shadow 仓（挂载 /shadow），按 URL 直达：
  #   /shadow/<工程名>-shadow/reports/daily/YYYY-MM-DD/  （日报，按日期）
  #   /shadow/<工程名>-shadow/reports/<task_type>/       （分析类，原地更新）
  #   /shadow/<工程名>-shadow/know-how/<主题>/            （蒸馏卡片）
