# Jenkins Configuration as Code（保持最小集，避免 JCasC 版本差异导致启动失败）
# 环境变量来自 docker-compose.yml（JENKINS_ADMIN_ID / JENKINS_ADMIN_PASSWORD）
jenkins:
  systemMessage: "AISystem Jenkins —— 配置由 JCasC 管理"
  mode: NORMAL
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://ci.localhost/"
  timestamper:
    allPipelines: true

jobs:
  - script: >
      pipelineJob('chronicler-selftest') {
        description('Chronicler 组件自检（FR-MGR-023）：契约校验 + 可选沙箱部署测试')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('http://gitea:3000/gitea_admin/ai-cicd-system.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
