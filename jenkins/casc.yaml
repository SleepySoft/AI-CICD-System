# Jenkins Configuration as Code（保持最小集，避免 JCasC 版本差异导致启动失败）
# 环境变量来自 docker-compose.yml（JENKINS_ADMIN_ID / JENKINS_ADMIN_PASSWORD）
jenkins:
  systemMessage: "AISystem Jenkins —— 配置由 JCasC 管理"
  mode: NORMAL
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://ci.localhost/"
  timestamper:
    allPipelines: true
  giteaServers:
    servers:
      - displayName: "Gitea（内网直连）"
        serverUrl: "http://gitea:3000"
        credentialsId: "gitea-admin"
        manageHooks: false
      - displayName: "Gitea（公开域名）"
        serverUrl: "http://git.localhost"
        credentialsId: "gitea-admin"
        manageHooks: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: gitea-admin
              username: "${GITEA_ADMIN_USER}"
              password: "${GITEA_ADMIN_PASSWORD}"

# 注意：jobs 不写在 JCasC（job-dsl 脚本出错会让 Jenkins 崩溃循环，2026-08-29 实测）；
# 任务创建走 scripts/wire-jenkins-job.sh（启动后经 REST 投递 config.xml）
